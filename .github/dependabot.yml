version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      # Security fixes arrive as one PR per run instead of one per
      # advisory — a single Next.js release can carry a dozen CVEs.
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
      dev-dependencies:
        applies-to: version-updates
        dependency-type: 'development'
      production-dependencies:
        applies-to: version-updates
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # ESLint ecosystem: blocked by eslint-plugin-react@7.37.5 peer ^9.7
      # Sibling pkgs (@eslint/js, @typescript-eslint/*) must move together.
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@eslint/js'
        update-types:
          - 'version-update:semver-major'
      # Pinned to current Node LTS; bump in lockstep with Node bumps
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
